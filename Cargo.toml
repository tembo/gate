[package]
name = "tembo-gate"
version = "0.1.0"
edition = "2024"
# Oxc 0.120 needs 1.92
rust-version = "1.92"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
http = "1.5.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
regex = "1.13.1"
sha2 = "0.10.9"
sse-stream = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros", "client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
rquickjs = { version = "0.14", default-features = false, features = ["futures", "std"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.20"
url = "2.5.8"
# Keep Oxc and its locked browserslist dependency compatible with the existing compiler.
oxc = { version = "=0.120.0", default-features = false, features = ["semantic", "transformer", "codegen"] }
oxc_sourcemap = "6.1.1"

[dev-dependencies]
axum = "0.8.9"
rmcp = { version = "3.5.1", features = ["transport-streamable-http-server"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["test-util"] }
